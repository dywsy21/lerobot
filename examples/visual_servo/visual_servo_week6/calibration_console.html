<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>相机内参标定</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:1100px;margin:24px auto;padding:0 20px;background:#11151b;color:#e8edf4}h1{font-size:25px;margin:0 0 6px}p{line-height:1.6}header{display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#aab8c9;font-size:14px}.metrics{display:flex;gap:28px;margin:20px 0;flex-wrap:wrap}.value{font-size:23px;font-weight:600}.live{width:100%;display:block;background:#1c2530;aspect-ratio:16/9;object-fit:contain;border-radius:8px}#message{font-size:18px;color:#8bcbff;min-height:28px}button{border:1px solid #516579;border-radius:6px;padding:9px 18px;background:#243747;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}progress{width:100%;height:12px;accent-color:#73c4a6}.controls{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}pre{white-space:pre-wrap;line-height:1.5;background:#18222d;padding:16px;border-radius:6px}a{color:#91c9f5}#result{display:none}.guide{border-left:3px solid #587c9a;padding-left:14px}#comparison{display:none}.ok{color:#7bd4ad}.warn{color:#ffd28b}
</style></head><body>
<header><div><h1>相机内参标定</h1><div class="muted" id="camera">正在连接相机…</div></div><span class="muted">真实相机 · 本地采集</span></header>
<div class="metrics"><div><div class="muted">有效标定图像</div><div class="value" id="count">0 / 20</div></div><div><div class="muted">棋盘格</div><div class="value" id="board">正在读取参数</div></div><div><div class="muted">角点检测</div><div class="value" id="detected">等待画面</div></div><div><div class="muted">独立验证</div><div class="value" id="validation">0 / 3</div></div></div>
<progress id="progress" max="20" value="0"></progress><p id="message" role="status">请将完整棋盘格放入画面。</p>
<img id="preview" class="live" alt="相机实时画面">
<div class="controls"><button id="pause">暂停采集</button><button id="resume">继续采集</button><button id="compare" disabled>查看去畸变画面</button></div>
<div class="guide"><p>保持相机焦距不变。缓慢移动棋盘格，依次覆盖画面中央、四角，改变远近，并向左右和上下倾斜；每个姿态停稳约 2 秒。避免棋盘格被裁切、遮挡、反光或弯曲。</p><p class="muted" id="collectionGuide">自动保存清晰、完整且不同的姿态。请在标定图像采集完成后，再摆 3 个新姿态作为验证图像。所有图像保存在本机。</p></div>
<section id="result"><h2>标定结果</h2><p id="quality"></p><pre id="matrix"></pre><p><a href="/intrinsics.yaml" target="_blank">查看内参文件</a></p><p class="muted" id="output"></p></section>
<script>
const $=id=>document.getElementById(id); let showingUndistorted=false; let lastFrame=0;
async function action(name){try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name})});const s=await r.json();if(s.error)$('message').textContent=s.error;}catch(e){$('message').textContent='服务连接失败：'+e.message}}
$('pause').onclick=()=>action('pause');$('resume').onclick=()=>action('resume');$('compare').onclick=()=>{showingUndistorted=!showingUndistorted;$('compare').textContent=showingUndistorted?'查看原始画面':'查看去畸变画面'};
async function update(){try{const r=await fetch('/status');const s=await r.json();$('camera').textContent=`${s.camera} · ${s.image_size.join(' × ')} · USB 相机索引 ${s.camera_index}`;$('count').textContent=`${s.count} / ${s.target}`;$('collectionGuide').textContent=`自动保存清晰、完整且不同的姿态。完成 ${s.target} 张标定图像后，请再摆 3 个新姿态作为验证图像。所有图像保存在本机。`;$('board').textContent=`${s.board.join(' × ')} · ${s.square_mm} mm`;$('validation').textContent=`${s.validation_count} / 3`;$('progress').value=s.count;$('progress').max=s.target;const n=s.board[0]*s.board[1];$('detected').textContent=s.detected?(s.stable?`${n} 个 · 已停稳`:`${n} 个 · 请停稳`):'未找到完整棋盘格';$('message').textContent=s.message;$('pause').disabled=!s.automatic;$('resume').disabled=s.automatic||['complete','calibrating','error'].includes(s.stage);if(s.frame_number!==lastFrame){lastFrame=s.frame_number;$('preview').src=(showingUndistorted?'/undistorted.jpg':'/frame.jpg')+'?t='+Date.now()}if(s.result){$('result').style.display='block';$('compare').disabled=false;const x=s.result;const quality=x.rms_px<=1;$('quality').className=quality?'ok':'warn';$('quality').textContent=`训练重投影 RMS：${x.rms_px.toFixed(4)} px；课程目标约 1 px。`+(x.validation.length?` 验证：${x.validation.map(v=>v.rmse_px.toFixed(4)).join(' / ')} px。`:' 等待 3 张独立验证图像。');$('matrix').textContent='K（像素单位）\n'+x.K.map(row=>row.map(v=>v.toFixed(4)).join('  ')).join('\n')+'\n\n畸变系数 [k1, k2, p1, p2, k3]\n'+x.distortion.map(v=>v.toFixed(7)).join(', ');$('output').textContent='保存位置：'+s.output;}}catch(e){$('message').textContent='暂时无法读取相机服务：'+e.message}finally{setTimeout(update,650)}}update();
</script></body></html>
