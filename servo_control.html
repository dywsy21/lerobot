<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SCS215 校准控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1118'/%3E%3Cpath d='M15 35h34M21 20h22v27H21z' fill='none' stroke='%235eead4' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #070a0e;
      --panel: #111821;
      --line: #293442;
      --text: #eef5f7;
      --muted: #8d9aa8;
      --dim: #596777;
      --mint: #5eead4;
      --amber: #f6c453;
      --red: #ff7180;
      --shadow: 0 20px 55px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% -5%, rgba(94, 234, 212, .1), transparent 30rem),
        radial-gradient(circle at 94% 3%, rgba(246, 196, 83, .07), transparent 25rem),
        var(--bg);
    }

    button, input { font: inherit; }

    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 15px;
      color: var(--text);
      background: #18212c;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #526073;
    }

    button:disabled { cursor: not-allowed; opacity: .36; }

    button.primary {
      color: #07110f;
      font-weight: 800;
      border-color: transparent;
      background: var(--mint);
    }

    button.danger { color: #ffb0b8; }

    .app {
      width: min(1440px, calc(100% - 42px));
      margin: 0 auto;
      padding: 30px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .logo {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--mint);
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(145deg, #18242e, #0d1319);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(21px, 3vw, 28px);
      letter-spacing: -.02em;
    }

    .subtitle { color: var(--muted); font-size: 14px; }

    .connection {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 8px 7px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(17, 24, 33, .88);
    }

    .connection-state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
      font-size: 14px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5563; }

    .dot.online {
      background: var(--mint);
      box-shadow: 0 0 0 5px rgba(94, 234, 212, .12);
    }

    .dot.error {
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(255, 113, 128, .12);
    }

    .global-panel {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto auto;
      gap: 22px;
      align-items: center;
      padding: 16px 19px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(17, 24, 33, .86);
      box-shadow: var(--shadow);
    }

    .speed-control {
      display: grid;
      grid-template-columns: 100px minmax(160px, 1fr) 76px;
      align-items: center;
      gap: 14px;
      color: var(--muted);
    }

    .speed-value, .rate-value {
      padding: 8px 10px;
      text-align: center;
      border-radius: 10px;
      background: #0b1117;
      font-variant-numeric: tabular-nums;
    }

    .speed-value { color: var(--amber); }

    .rate-box {
      min-width: 132px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .rate-value {
      display: block;
      margin-top: 4px;
      color: var(--mint);
      font-size: 14px;
    }

    .global-actions { display: flex; gap: 8px; }

    input[type="range"] {
      --fill: 50%;
      width: 100%;
      height: 6px;
      margin: 10px 0;
      appearance: none;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(to right, var(--mint) 0 var(--fill), #364351 var(--fill) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 19px;
      height: 19px;
      appearance: none;
      border: 3px solid #13201f;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 2px #748391;
      cursor: grab;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 3px solid #13201f;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 2px #748391;
      cursor: grab;
    }

    input[type="range"]:disabled { opacity: .35; }

    .servo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .servo-card {
      min-width: 0;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: linear-gradient(155deg, rgba(24, 33, 43, .97), rgba(14, 20, 28, .97));
      box-shadow: var(--shadow);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .servo-card.tracking {
      border-color: rgba(246, 196, 83, .48);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28), inset 0 0 28px rgba(246, 196, 83, .035);
    }

    .servo-card.reached { animation: reached .42s ease; }
    @keyframes reached { 50% { border-color: rgba(94, 234, 212, .72); } }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .id-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--amber);
      font: 13px ui-monospace, Consolas, monospace;
    }

    .online-label { color: var(--muted); font-family: Inter, "Segoe UI", sans-serif; }
    .online-label.ok { color: var(--mint); }
    .online-label.bad { color: var(--red); }

    h2 { margin: 7px 0 3px; font-size: 20px; }
    .calibration-label { color: var(--dim); font: 11px ui-monospace, Consolas, monospace; }

    .torque-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .switch { position: relative; display: inline-block; width: 43px; height: 24px; }
    .switch input { width: 0; height: 0; opacity: 0; }

    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #394553;
      cursor: pointer;
      transition: .18s ease;
    }

    .switch span::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #b6c0cb;
      transition: .18s ease;
    }

    .switch input:checked + span { background: #19413c; }
    .switch input:checked + span::before { transform: translateX(19px); background: var(--mint); }
    .switch input:disabled + span { cursor: not-allowed; opacity: .5; }

    .position-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 25px 2px 12px;
    }

    .position-block:last-child { text-align: right; }

    .position-value {
      display: block;
      min-height: 34px;
      font: 800 27px ui-monospace, Consolas, monospace;
      letter-spacing: .02em;
    }

    .position-block:last-child .position-value { color: var(--mint); }
    .position-label { color: var(--muted); font-size: 12px; }

    .slider-shell {
      --actual: 50%;
      --between-left: 50%;
      --between-width: 0%;
      position: relative;
      padding: 7px 0;
    }

    .slider-shell input { position: relative; z-index: 3; display: block; }

    .journey {
      position: absolute;
      z-index: 1;
      top: 17px;
      left: var(--between-left);
      width: var(--between-width);
      height: 6px;
      border-radius: 999px;
      background: var(--amber);
      opacity: .66;
      transition: left .07s linear, width .07s linear;
      pointer-events: none;
    }

    .actual-marker {
      position: absolute;
      z-index: 4;
      top: 9px;
      left: var(--actual);
      width: 3px;
      height: 22px;
      border-radius: 3px;
      background: #f6f8fa;
      box-shadow: 0 0 0 2px rgba(7, 10, 14, .78), 0 0 10px rgba(255, 255, 255, .36);
      transform: translateX(-50%);
      transition: left .07s linear;
      pointer-events: none;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font: 11px ui-monospace, Consolas, monospace;
    }

    .motion-line { min-height: 19px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .motion-line.moving { color: var(--amber); }
    .motion-line.done { color: var(--mint); }
    .motion-line.error { color: var(--red); }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 15px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border: 1px solid #26313d;
      border-radius: 11px;
      background: rgba(7, 11, 16, .48);
    }

    .metric-name { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }

    .metric-value {
      overflow: hidden;
      display: block;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 700 13px ui-monospace, Consolas, monospace;
    }

    .message { min-height: 22px; margin: 17px 2px 0; color: var(--muted); font-size: 14px; }
    .message.ok { color: var(--mint); }
    .message.error { color: var(--red); }

    .footnote { margin: 8px 2px 0; color: var(--dim); text-align: center; font-size: 12px; }

    @media (max-width: 1080px) {
      .servo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .global-panel { grid-template-columns: 1fr auto; }
      .rate-box { grid-column: 1; text-align: left; }
      .global-actions { grid-column: 2; grid-row: 1 / 3; flex-direction: column; }
    }

    @media (max-width: 680px) {
      .app { width: min(100% - 24px, 1440px); padding-top: 18px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .connection { justify-content: space-between; }
      .servo-grid { grid-template-columns: 1fr; }
      .global-panel { grid-template-columns: 1fr; }
      .speed-control { grid-template-columns: 1fr 70px; }
      .speed-control > span:first-child { grid-column: 1 / -1; }
      .rate-box { grid-column: 1; }
      .global-actions { grid-column: 1; grid-row: auto; display: grid; grid-template-columns: 1fr 1fr; }
      .global-actions button:first-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">S6</div>
        <div>
          <h1>SCS215 校准控制台</h1>
          <div class="subtitle">单段连续校准 · 六轴统一映射至 0.000～1.000</div>
        </div>
      </div>
      <div class="connection">
        <div class="connection-state">
          <span class="dot" id="connectionDot"></span>
          <span id="connectionText">未连接</span>
        </div>
        <button class="primary" id="connectButton">连接串口</button>
      </div>
    </header>

    <section class="global-panel">
      <div class="speed-control">
        <span>目标速度</span>
        <input id="speedSlider" type="range" min="1" max="1500" value="300" aria-label="目标速度">
        <span class="speed-value" id="speedValue">300</span>
      </div>
      <div class="rate-box">位置刷新速度<span class="rate-value" id="pollRate">-- Hz · -- ms</span></div>
      <div class="global-actions">
        <button id="refreshButton" disabled>刷新详细状态</button>
        <button id="torqueOnButton" disabled>全部上扭矩</button>
        <button class="danger" id="torqueOffButton" disabled>全部关扭矩</button>
      </div>
    </section>

    <section class="servo-grid" id="servoGrid" aria-label="舵机控制"></section>
    <div class="message" id="message">请使用 Chrome 或 Edge 打开，并点击“连接串口”。</div>
    <div class="footnote">白色细线＝实际位置；绿色滑块＝目标位置；使用 2026-09-26 的单段连续校准，直接映射到 0–1，无需跨界切换。</div>
  </main>

  <script>
    "use strict";

    const RESOLUTION = 1024;
    const READ_RETRIES = 2;
    const POSITION_TIMEOUT_MS = 100;
    const TARGET_EPSILON = 0.008;

    // C:\Users\Admin\.cache\huggingface\lerobot\calibration\robots\so101_scs215_follower\scs215_follower.json
    // Updated from the calibration saved on 2026-09-26 at 20:29.
    const calibration = [
      { id: 1, key: "shoulder_pan",  name: "底座旋转", min: 216, max: 941,  driveMode: 0, segments: [[216, 941]] },
      { id: 2, key: "shoulder_lift", name: "肩部",     min: 212, max: 912,  driveMode: 0, segments: [[212, 912]] },
      { id: 3, key: "elbow_flex",    name: "肘部",     min: 205, max: 814,  driveMode: 0, segments: [[205, 814]] },
      { id: 4, key: "wrist_flex",    name: "腕部俯仰", min: 247, max: 927,  driveMode: 0, segments: [[247, 927]] },
      { id: 5, key: "wrist_roll",    name: "腕部旋转", min: 3,   max: 1022, driveMode: 0, segments: [[3, 1022]] },
      { id: 6, key: "gripper",       name: "夹爪",     min: 336, max: 755,  driveMode: 0, segments: [[336, 755]] }
    ];

    const $ = function (selector) { return document.querySelector(selector); };
    const clamp = function (value, min, max) { return Math.min(max, Math.max(min, value)); };
    const modulo = function (value, modulus) { return ((value % modulus) + modulus) % modulus; };

    function segmentForRaw(raw, config) {
      if (raw === null || !Number.isFinite(Number(raw))) return -1;
      const position = modulo(Number(raw), RESOLUTION);
      return config.segments.findIndex(function (segment) {
        return segment[0] <= position && position <= segment[1];
      });
    }

    function rawToUnit(raw, config) {
      if (config.segments.length === 1) {
        const value = clamp((Number(raw) - config.min) / (config.max - config.min), 0, 1);
        return config.driveMode ? 1 - value : value;
      }
      const segmentIndex = segmentForRaw(raw, config);
      let distance;
      if (segmentIndex >= 0) {
        distance = config.segments.slice(0, segmentIndex).reduce(function (sum, segment) {
          return sum + segment[1] - segment[0] + 1;
        }, 0) + modulo(Number(raw), RESOLUTION) - config.segments[segmentIndex][0];
      } else {
        const fromStart = modulo(Number(raw) - config.segments[0][0], RESOLUTION);
        const pastEnd = fromStart - (config.max - config.min);
        distance = pastEnd <= RESOLUTION - fromStart ? config.max - config.min : 0;
      }
      let value = distance / (config.max - config.min);
      return config.driveMode ? 1 - value : value;
    }

    function unitToRaw(unit, config) {
      let value = clamp(Number(unit), 0, 1);
      if (config.driveMode) value = 1 - value;
      let distance = Math.round(value * (config.max - config.min));
      for (const segment of config.segments) {
        const length = segment[1] - segment[0] + 1;
        if (distance < length) return segment[0] + distance;
        distance -= length;
      }
      throw new Error("目标超出已记录的校准区间");
    }

    class Scs215SeamController {
      constructor(config) {
        this.config = config;
        this.phase = "position";
        this.direction = 0;
        this.destination = 0;
        this.started = 0;
        this.lastRaw = 0;
        this.lastGoal = null;
        this.lastPwm = null;
        this.crossed = false;
        this.stable = 0;
        this.reverseTravel = 0;
      }

      segment(raw, nearest) {
        const found = segmentForRaw(raw, this.config);
        if (found >= 0) return found;
        if (!nearest) throw new Error("目标超出校准区间");
        const distances = this.config.segments.map(function (segment) {
          return Math.min(Math.abs(raw - segment[0]), Math.abs(raw - segment[1]));
        });
        return distances.indexOf(Math.min.apply(null, distances));
      }

      pwm(elapsed) {
        const magnitude = Math.min(400, 180 + 40 * Math.floor(elapsed / 0.4));
        return magnitude | (this.direction > 0 ? 1024 : 0);
      }

      step(raw, target, now) {
        if (!Number.isInteger(raw) || raw < 0 || raw > 1023) throw new Error("位置反馈无效");
        const targetSegment = this.segment(target, false);
        if (this.phase === "bridge") {
          const delta = raw - this.lastRaw;
          if (delta * this.direction < -512) {
            this.crossed = true;
            this.reverseTravel = 0;
          } else if (delta * this.direction > 512) {
            this.crossed = false;
            this.stable = 0;
          } else if (delta * this.direction < -2) {
            this.reverseTravel -= delta * this.direction;
          } else if (delta * this.direction > 0) {
            this.reverseTravel = Math.max(0, this.reverseTravel - delta * this.direction);
          }
          this.lastRaw = raw;
          if (this.reverseTravel > 24) throw new Error("跨界驱动方向与反馈不一致");
          const segment = this.config.segments[this.destination];
          const margin = Math.min(8, Math.floor((segment[1] - segment[0]) / 2));
          const inside = raw >= segment[0] && raw <= segment[1] &&
            (this.direction > 0 ? raw >= segment[0] + margin : raw <= segment[1] - margin);
          this.stable = this.crossed && inside ? this.stable + 1 : 0;
          if (this.stable >= 2) {
            this.phase = "position";
            const goal = targetSegment === this.destination ? target : raw;
            this.lastGoal = goal;
            return { kind: "exit_pwm", value: goal };
          }
          const elapsed = now - this.started;
          if (elapsed >= 3) throw new Error("跨界后未恢复位置反馈，已停止驱动");
          const pwm = this.pwm(elapsed);
          if (pwm !== this.lastPwm) {
            this.lastPwm = pwm;
            return { kind: "pwm", value: pwm };
          }
          return null;
        }
        const source = this.segment(raw, true);
        if (source === targetSegment) {
          this.phase = "position";
          if (target !== this.lastGoal) {
            this.lastGoal = target;
            return { kind: "position", value: target };
          }
          return null;
        }
        const direction = source < targetSegment ? 1 : -1;
        if (this.phase !== "approach" || direction !== this.direction) {
          this.phase = "approach";
          this.started = now;
        }
        this.direction = direction;
        this.destination = targetSegment;
        const entry = direction > 0 ? Math.max(this.config.segments[source][0], 1011) :
          Math.min(this.config.segments[source][1], 12);
        if ((raw - entry) * direction >= -12) {
          this.phase = "bridge";
          this.started = now;
          this.lastRaw = raw;
          this.crossed = false;
          this.stable = 0;
          this.reverseTravel = 0;
          this.lastPwm = this.pwm(0);
          return { kind: "enter_pwm", value: this.lastPwm };
        }
        if (now - this.started >= 10) throw new Error("未到达跨界入口，已停止当前目标");
        if (this.lastGoal !== entry) {
          this.lastGoal = entry;
          return { kind: "position", value: entry };
        }
        return null;
      }
    }

    const states = new Map(calibration.map(function (config) {
      return [config.id, {
        config: config,
        online: false,
        raw: null,
        actual: null,
        target: null,
        torque: null,
        moving: false,
        control: new Scs215SeamController(config),
        controlActive: false,
        motionEpoch: 0,
        commandError: null,
        wasTracking: false
      }];
    }));

    const servoGrid = $("#servoGrid");
    const connectButton = $("#connectButton");
    const refreshButton = $("#refreshButton");
    const torqueOnButton = $("#torqueOnButton");
    const torqueOffButton = $("#torqueOffButton");
    const speedSlider = $("#speedSlider");
    const speedValue = $("#speedValue");
    const pollRate = $("#pollRate");
    const connectionDot = $("#connectionDot");
    const connectionText = $("#connectionText");
    const message = $("#message");

    calibration.forEach(function (config) {
      servoGrid.insertAdjacentHTML("beforeend",
        '<article class="servo-card" id="card-' + config.id + '">' +
          '<div class="card-head"><div>' +
            '<div class="id-row">ID ' + config.id + '<span class="online-label" id="online-' + config.id + '">离线</span></div>' +
            '<h2>' + config.name + '</h2>' +
            '<div class="calibration-label">' + config.key + ' · ' + config.segments.map(function (segment) { return segment[0] + '–' + segment[1]; }).join(' → ') + '</div>' +
          '</div><div class="torque-wrap"><span>扭矩</span><label class="switch">' +
            '<input id="torque-' + config.id + '" type="checkbox" disabled aria-label="ID ' + config.id + ' 扭矩"><span></span>' +
          '</label></div></div>' +
          '<div class="position-row">' +
            '<div class="position-block"><span class="position-value" id="actual-' + config.id + '">---</span><span class="position-label">实际位置</span></div>' +
            '<div class="position-block"><span class="position-value" id="target-' + config.id + '">---</span><span class="position-label">目标位置</span></div>' +
          '</div>' +
          '<div class="slider-shell" id="shell-' + config.id + '"><div class="journey"></div><div class="actual-marker"></div>' +
            '<input id="slider-' + config.id + '" type="range" min="0" max="1" step="0.001" value="0.5" disabled aria-label="' + config.name + '归一化位置">' +
          '</div>' +
          '<div class="range-labels"><span>0.000</span><span>0.500</span><span>1.000</span></div>' +
          '<div class="motion-line" id="motion-' + config.id + '">等待位置反馈</div>' +
          '<div class="telemetry">' +
            '<div class="metric"><span class="metric-name">原始位置</span><span class="metric-value" id="raw-' + config.id + '">----</span></div>' +
            '<div class="metric"><span class="metric-name">电压</span><span class="metric-value" id="voltage-' + config.id + '">--.- V</span></div>' +
            '<div class="metric"><span class="metric-name">温度 / 状态</span><span class="metric-value" id="status-' + config.id + '">--</span></div>' +
          '</div>' +
        '</article>'
      );
    });

    function setRangeFill(slider) {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const value = Number(slider.value);
      slider.style.setProperty("--fill", ((value - min) / (max - min)) * 100 + "%");
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.className = "message" + (type ? " " + type : "");
    }

    function setConnection(type, text) {
      connectionDot.className = "dot" + (type ? " " + type : "");
      connectionText.textContent = text;
      const connected = type === "online";
      connectButton.textContent = connected ? "断开" : "连接串口";
      refreshButton.disabled = !connected;
      torqueOnButton.disabled = !connected;
      torqueOffButton.disabled = !connected;
    }

    function setCardOffline(id, error) {
      const state = states.get(id);
      state.online = false;
      const online = $("#online-" + id);
      online.textContent = "离线";
      online.className = "online-label bad";
      $("#slider-" + id).disabled = true;
      $("#torque-" + id).disabled = true;
      $("#motion-" + id).textContent = error || "无位置反馈";
      $("#motion-" + id).className = "motion-line";
    }

    function updateJourney(id) {
      const state = states.get(id);
      if (state.actual === null || state.target === null) return;
      const actual = clamp(state.actual, 0, 1);
      const target = clamp(state.target, 0, 1);
      const actualPercent = actual * 100;
      const targetPercent = target * 100;
      const shell = $("#shell-" + id);
      shell.style.setProperty("--actual", actualPercent + "%");
      shell.style.setProperty("--between-left", Math.min(actualPercent, targetPercent) + "%");
      shell.style.setProperty("--between-width", Math.abs(actualPercent - targetPercent) + "%");

      if (state.commandError) {
        const motion = $("#motion-" + id);
        motion.textContent = state.commandError;
        motion.className = "motion-line error";
        return;
      }

      const error = Math.abs(actual - target);
      const crossing = state.controlActive && state.control.phase !== "position";
      const tracking = error > TARGET_EPSILON || crossing;
      const card = $("#card-" + id);
      const motion = $("#motion-" + id);
      card.classList.toggle("tracking", tracking);
      if (tracking) {
        motion.textContent = (crossing ? "跨界移动中" : "趋向目标") + " · 剩余 " + error.toFixed(3);
        motion.className = "motion-line moving";
      } else {
        motion.textContent = "已到目标";
        motion.className = "motion-line done";
        if (state.wasTracking) {
          card.classList.remove("reached");
          void card.offsetWidth;
          card.classList.add("reached");
        }
      }
      state.wasTracking = tracking;
    }

    function updatePosition(id, raw, packetError) {
      const state = states.get(id);
      const wasOffline = !state.online;
      state.online = true;
      state.raw = raw;
      state.actual = rawToUnit(raw, state.config);
      const online = $("#online-" + id);
      online.textContent = "在线";
      online.className = "online-label ok";
      $("#slider-" + id).disabled = false;
      $("#torque-" + id).disabled = false;
      $("#actual-" + id).textContent = state.actual.toFixed(3);
      $("#raw-" + id).textContent = String(raw);

      if (state.target === null) {
        state.target = state.actual;
        const slider = $("#slider-" + id);
        slider.value = state.target.toFixed(3);
        $("#target-" + id).textContent = state.target.toFixed(3);
        setRangeFill(slider);
      }
      if (packetError) {
        $("#status-" + id).textContent = "错误 0x" + packetError.toString(16).padStart(2, "0");
      }
      updateJourney(id);
      if (wasOffline) setMessage("ID " + id + " 已恢复位置反馈。", "ok");
    }

    function updateTelemetry(id, data) {
      const state = states.get(id);
      state.torque = Boolean(data.torque);
      state.moving = Boolean(data.moving);
      $("#torque-" + id).checked = state.torque;
      $("#voltage-" + id).textContent = data.voltage.toFixed(1) + " V";
      const status = data.error || data.status;
      $("#status-" + id).textContent = data.temperature + " °C · " +
        (status ? "0x" + status.toString(16).padStart(2, "0") : "正常");
      bus.torqueCache.set(id, state.torque);
    }

    class FeetechSerial {
      constructor() {
        this.port = null;
        this.reader = null;
        this.writer = null;
        this.buffer = [];
        this.waiter = null;
        this.queue = Promise.resolve();
        this.reading = false;
        this.speedCache = new Map();
        this.torqueCache = new Map();
        this.modeSnapshots = new Map();
        this.controlQueue = Promise.resolve();
      }

      get connected() { return Boolean(this.port && this.port.readable && this.port.writable); }

      runControl(operation) {
        const result = this.controlQueue.then(operation, operation);
        this.controlQueue = result.catch(function () {});
        return result;
      }

      async checkedWord(id, address, value) {
        const result = await this.writeWord(id, address, value);
        if (result.error) throw new Error("写入失败 0x" + result.error.toString(16));
      }

      async checkedByte(id, address, value) {
        const result = await this.writeByte(id, address, value);
        if (result.error) throw new Error("写入失败 0x" + result.error.toString(16));
      }

      async enterMotorMode(id, pwm) {
        const limits = await this.readBytes(id, 9, 4);
        const settings = await this.readBytes(id, 46, 3);
        if (limits.error || settings.error) throw new Error("读取舵机配置时返回错误");
        this.modeSnapshots.set(id, {
          min: this.word(limits.bytes, 0), max: this.word(limits.bytes, 2) || 1023,
          speed: this.word(settings.bytes, 0), lock: settings.bytes[2]
        });
        await this.checkedByte(id, 48, 1);
        await this.checkedWord(id, 44, 0);
        await this.checkedWord(id, 9, 0);
        await this.checkedWord(id, 11, 0);
        const mode = await this.readBytes(id, 9, 4);
        if (mode.error || this.word(mode.bytes, 0) !== 0 || this.word(mode.bytes, 2) !== 0) throw new Error("未能进入跨界驱动模式");
        await this.checkedByte(id, 40, 1);
        this.torqueCache.set(id, true);
        await this.checkedWord(id, 44, pwm);
      }

      async exitMotorMode(id, goal, disable) {
        const original = this.modeSnapshots.get(id);
        if (!original) return;
        await this.checkedWord(id, 44, 0);
        if (disable) {
          await this.checkedByte(id, 40, 0);
          this.torqueCache.set(id, false);
        }
        await this.checkedByte(id, 48, 1);
        await this.checkedWord(id, 42, goal);
        await this.checkedWord(id, 11, original.max);
        await this.checkedWord(id, 9, original.min);
        await this.checkedWord(id, 46, original.speed);
        await this.checkedByte(id, 48, original.lock);
        this.modeSnapshots.delete(id);
        this.speedCache.delete(id);
      }

      async abortMotion(id) {
        // Stop output first, even if the next position read fails.
        await this.checkedByte(id, 40, 0);
        this.torqueCache.set(id, false);
        if (this.modeSnapshots.has(id)) {
          await this.checkedWord(id, 44, 0);
          let raw = states.get(id).raw;
          try { raw = (await this.readPosition(id)).position; } catch (_) {}
          await this.exitMotorMode(id, raw === null ? 512 : raw, true);
        }
      }

      async recoverPositionMode(id, raw) {
        const limits = await this.readBytes(id, 9, 4);
        if (this.word(limits.bytes, 0) === 0 && this.word(limits.bytes, 2) === 0) {
          this.modeSnapshots.set(id, { min: 0, max: 1023, speed: 300, lock: 1 });
          await this.exitMotorMode(id, raw, true);
        }
      }

      checksum(bytes) {
        let sum = 0;
        bytes.forEach(function (byte) { sum = (sum + byte) & 0xff; });
        return (~sum) & 0xff;
      }

      instruction(id, code, params) {
        const values = params || [];
        const body = [id, values.length + 2, code].concat(values);
        return new Uint8Array([0xff, 0xff].concat(body, [this.checksum(body)]));
      }

      async connect() {
        if (!("serial" in navigator)) throw new Error("此浏览器不支持 Web Serial，请使用最新版 Chrome 或 Edge。");
        this.port = await navigator.serial.requestPort();
        await this.port.open({ baudRate: 1000000, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
        this.reader = this.port.readable.getReader();
        this.writer = this.port.writable.getWriter();
        this.buffer = [];
        this.queue = Promise.resolve();
        this.speedCache.clear();
        this.torqueCache.clear();
        this.reading = true;
        this.readLoop();
      }

      async disconnect() {
        this.reading = false;
        if (this.waiter) {
          this.waiter.reject(new Error("串口已断开"));
          clearTimeout(this.waiter.timer);
          this.waiter = null;
        }
        try { if (this.reader) await this.reader.cancel(); } catch (_) {}
        try { if (this.reader) this.reader.releaseLock(); } catch (_) {}
        try { if (this.writer) this.writer.releaseLock(); } catch (_) {}
        try { if (this.port) await this.port.close(); } catch (_) {}
        this.reader = null;
        this.writer = null;
        this.port = null;
        this.buffer = [];
        this.queue = Promise.resolve();
        this.speedCache.clear();
        this.torqueCache.clear();
      }

      async readLoop() {
        try {
          while (this.reading && this.reader) {
            const result = await this.reader.read();
            if (result.done) break;
            if (result.value) {
              this.buffer.push.apply(this.buffer, Array.from(result.value));
              this.parsePackets();
            }
          }
        } catch (error) {
          if (this.reading) setMessage("串口读取失败：" + error.message, "error");
        }
      }

      parsePackets() {
        while (this.buffer.length >= 6) {
          while (this.buffer.length >= 2 && !(this.buffer[0] === 0xff && this.buffer[1] === 0xff)) this.buffer.shift();
          if (this.buffer.length < 4) return;
          const total = this.buffer[3] + 4;
          if (this.buffer.length < total) return;
          const raw = this.buffer.splice(0, total);
          const body = raw.slice(2, -1);
          if (this.checksum(body) !== raw[raw.length - 1]) continue;
          const packet = { id: raw[2], error: raw[4], params: raw.slice(5, -1) };
          if (this.waiter && this.waiter.id === packet.id) {
            const waiter = this.waiter;
            this.waiter = null;
            clearTimeout(waiter.timer);
            waiter.resolve(packet);
          }
        }
      }

      transact(id, bytes, timeout) {
        const waitMs = timeout || 220;
        const operation = async () => {
          if (!this.connected) throw new Error("串口未连接");
          const response = new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              if (this.waiter && this.waiter.timer === timer) this.waiter = null;
              reject(new Error("ID " + id + " 无响应"));
            }, waitMs);
            this.waiter = { id: id, resolve: resolve, reject: reject, timer: timer };
          });
          await this.writer.write(bytes);
          return response;
        };
        const result = this.queue.then(operation, operation);
        this.queue = result.catch(function () {});
        return result;
      }

      async readBytes(id, address, length, timeout) {
        const packet = await this.transact(id, this.instruction(id, 0x02, [address, length]), timeout);
        if (packet.params.length < length) throw new Error("ID " + id + " 返回长度不足");
        return { bytes: packet.params.slice(0, length), error: packet.error };
      }

      writeByte(id, address, value) {
        return this.transact(id, this.instruction(id, 0x03, [address, value & 0xff]));
      }

      writeWord(id, address, value) {
        return this.transact(id, this.instruction(id, 0x03, [address, (value >> 8) & 0xff, value & 0xff]));
      }

      word(bytes, offset) { return (bytes[offset] << 8) | bytes[offset + 1]; }

      async readPosition(id, retries, timeout) {
        let lastError;
        const retryCount = retries === undefined ? READ_RETRIES : retries;
        for (let attempt = 0; attempt <= retryCount; attempt++) {
          try {
            const packet = await this.readBytes(id, 56, 2, timeout || POSITION_TIMEOUT_MS);
            return { position: this.word(packet.bytes, 0), error: packet.error };
          } catch (error) { lastError = error; }
        }
        throw lastError;
      }

      async readTelemetry(id) {
        const block = await this.readBytes(id, 40, 27);
        return {
          id: id,
          torque: block.bytes[0],
          goal: this.word(block.bytes, 2),
          position: this.word(block.bytes, 16),
          voltage: block.bytes[22] * 0.1,
          temperature: block.bytes[23],
          status: block.bytes[25],
          moving: block.bytes[26],
          error: block.error
        };
      }

      async setPosition(id, position, speed) {
        await this.checkedWord(id, 44, 0);
        if (this.speedCache.get(id) !== speed) {
          const speedResult = await this.writeWord(id, 46, speed);
          if (speedResult.error) return { error: speedResult.error };
          this.speedCache.set(id, speed);
        }
        const goalResult = await this.writeWord(id, 42, position);
        if (goalResult.error) return { error: goalResult.error };
        if (this.torqueCache.get(id) !== true) {
          const torqueResult = await this.writeByte(id, 40, 1);
          if (torqueResult.error) return { error: torqueResult.error };
          this.torqueCache.set(id, true);
        }
        return { error: 0 };
      }

      async setTorque(id, enabled) {
        if (this.modeSnapshots.has(id)) await this.abortMotion(id);
        if (enabled) {
          const current = await this.readPosition(id);
          const goalResult = await this.writeWord(id, 42, current.position);
          if (goalResult.error) return { id: id, enabled: false, error: goalResult.error };
        }
        const response = await this.writeByte(id, 40, enabled ? 1 : 0);
        if (!response.error) this.torqueCache.set(id, enabled);
        return { id: id, enabled: enabled, error: response.error };
      }
    }

    const bus = new FeetechSerial();
    let pollGeneration = 0;
    let polling = false;
    let telemetryId = 1;
    let lastTelemetryAt = 0;

    function queueTarget(id, unitValue) {
      const state = states.get(id);
      if (!Number.isFinite(Number(unitValue)) || !bus.connected || !state.online) return false;
      const target = clamp(Number(unitValue), 0, 1);
      if (!state.controlActive) {
        state.control = new Scs215SeamController(state.config);
        state.motionEpoch++;
      }
      state.commandError = null;
      state.target = target;
      state.controlActive = true;
      $("#target-" + id).textContent = state.target.toFixed(3);
      updateJourney(id);
      return true;
    }

    async function stopControl(id, error) {
      const state = states.get(id);
      state.controlActive = false;
      state.motionEpoch++;
      try { await bus.runControl(function () { return bus.abortMotion(id); }); }
      catch (stopError) { setMessage("ID " + id + " 停止反馈异常：" + stopError.message, "error"); }
      state.control = new Scs215SeamController(state.config);
      state.torque = false;
      $("#torque-" + id).checked = false;
      if (error) {
        state.commandError = error.message;
        setMessage("ID " + id + "：" + error.message, "error");
      }
      updateJourney(id);
    }

    async function advanceControl(id, raw, now) {
      const state = states.get(id);
      if (!state.controlActive) return;
      const epoch = state.motionEpoch;
      try {
        await bus.runControl(async function () {
          if (!state.controlActive || state.motionEpoch !== epoch) return;
          const command = state.control.step(raw, unitToRaw(state.target, state.config), now);
          if (!command) return;
          if (command.kind === "position") {
            const speed = Number(speedSlider.value);
            const result = await bus.setPosition(id, command.value, state.control.phase === "approach" ? Math.min(speed, 300) : speed);
            if (result.error) throw new Error("舵机返回错误位 0x" + result.error.toString(16));
          } else if (command.kind === "enter_pwm") {
            await bus.enterMotorMode(id, command.value);
          } else if (command.kind === "pwm") {
            const mode = await bus.readBytes(id, 11, 2);
            if (mode.error || bus.word(mode.bytes, 0) !== 0) throw new Error("跨界期间舵机模式被重置");
            await bus.checkedWord(id, 44, command.value);
          } else {
            await bus.exitMotorMode(id, command.value, false);
            await bus.checkedWord(id, 46, Number(speedSlider.value));
          }
          state.torque = true;
          $("#torque-" + id).checked = true;
        });
        updateJourney(id);
      } catch (error) { await stopControl(id, error); }
    }

    async function changeTorque(id, enabled) {
      const state = states.get(id);
      state.controlActive = false;
      state.motionEpoch++;
      const result = await bus.runControl(function () { return bus.setTorque(id, enabled); });
      state.control = new Scs215SeamController(state.config);
      state.target = null;
      state.commandError = null;
      return result;
    }

    async function stopControllers() {
      for (const config of calibration) {
        const state = states.get(config.id);
        const bridging = state.control.phase !== "position" || bus.modeSnapshots.has(config.id);
        state.controlActive = false;
        state.motionEpoch++;
        if (bridging) await stopControl(config.id);
      }
      await bus.controlQueue;
    }

    async function refreshTelemetry(showResult) {
      if (!bus.connected) return;
      let success = 0;
      for (const config of calibration) {
        try {
          const data = await bus.readTelemetry(config.id);
          updatePosition(config.id, data.position, data.error);
          updateTelemetry(config.id, data);
          success++;
        } catch (error) { setCardOffline(config.id, error.message); }
      }
      if (showResult) {
        setMessage("详细状态刷新完成：" + success + "/6 颗在线。", success === 6 ? "ok" : "error");
      }
    }

    async function startPositionPolling() {
      const generation = ++pollGeneration;
      polling = true;
      let cycles = 0;
      let rateStartedAt = performance.now();
      while (bus.connected && generation === pollGeneration) {
        const cycleStartedAt = performance.now();
        let onlineCount = 0;
        const crossing = calibration.some(function (config) { return states.get(config.id).control.phase === "bridge"; });
        const pollOrder = calibration.slice().sort(function (a, b) {
          return Number(states.get(b.id).control.phase === "bridge") - Number(states.get(a.id).control.phase === "bridge");
        });
        for (const config of pollOrder) {
          if (!bus.connected || generation !== pollGeneration) break;
          try {
            const data = await bus.readPosition(config.id, crossing ? 0 : READ_RETRIES, crossing ? 40 : POSITION_TIMEOUT_MS);
            if (data.error && states.get(config.id).controlActive) throw new Error("运动反馈错误 0x" + data.error.toString(16));
            updatePosition(config.id, data.position, data.error);
            await advanceControl(config.id, data.position, performance.now() / 1000);
            onlineCount++;
          } catch (error) {
            if (states.get(config.id).controlActive) await stopControl(config.id, error);
            setCardOffline(config.id, error.message);
          }
        }

        cycles++;
        const now = performance.now();
        const elapsed = now - rateStartedAt;
        if (elapsed >= 500) {
          const hz = cycles * 1000 / elapsed;
          pollRate.textContent = hz.toFixed(1) + " Hz · " + (now - cycleStartedAt).toFixed(0) + " ms";
          connectionText.textContent = "已连接 · " + onlineCount + "/6 在线";
          cycles = 0;
          rateStartedAt = now;
        }

        const bridgeActive = calibration.some(function (config) { return states.get(config.id).control.phase === "bridge"; });
        if (!bridgeActive && now - lastTelemetryAt >= 180 && bus.connected) {
          try {
            const telemetry = await bus.readTelemetry(telemetryId);
            updatePosition(telemetryId, telemetry.position, telemetry.error);
            updateTelemetry(telemetryId, telemetry);
          } catch (_) {}
          telemetryId = telemetryId % calibration.length + 1;
          lastTelemetryAt = performance.now();
        }
      }
      if (generation === pollGeneration) polling = false;
    }

    async function initializePositions() {
      let onlineCount = 0;
      for (const config of calibration) {
        try {
          const data = await bus.readPosition(config.id);
          await bus.recoverPositionMode(config.id, data.position);
          const state = states.get(config.id);
          state.target = null;
          state.controlActive = false;
          state.control = new Scs215SeamController(config);
          updatePosition(config.id, data.position, data.error);
          onlineCount++;
        } catch (error) { setCardOffline(config.id, error.message); }
      }
      return onlineCount;
    }

    async function setAllTorque(enabled) {
      let success = 0;
      for (const config of calibration) {
        try {
          const result = await changeTorque(config.id, enabled);
          if (!result.error) {
            states.get(config.id).torque = enabled;
            $("#torque-" + config.id).checked = enabled;
            success++;
          }
        } catch (error) { setMessage("ID " + config.id + "：" + error.message, "error"); }
      }
      setMessage((enabled ? "上扭矩" : "关扭矩") + "完成：" + success + "/6。", success === 6 ? "ok" : "error");
    }

    calibration.forEach(function (config) {
      const id = config.id;
      const slider = $("#slider-" + id);
      const torque = $("#torque-" + id);
      setRangeFill(slider);
      slider.addEventListener("input", function () {
        setRangeFill(slider);
        queueTarget(id, Number(slider.value));
      });
      torque.addEventListener("change", async function () {
        try {
          const result = await changeTorque(id, torque.checked);
          if (result.error) {
            torque.checked = !torque.checked;
            setMessage("ID " + id + " 返回错误位 0x" + result.error.toString(16) + "。", "error");
          } else { states.get(id).torque = torque.checked; }
        } catch (error) {
          torque.checked = !torque.checked;
          setMessage("ID " + id + " 扭矩写入失败：" + error.message, "error");
        }
      });
    });

    speedSlider.addEventListener("input", function () {
      speedValue.textContent = speedSlider.value;
      setRangeFill(speedSlider);
      bus.speedCache.clear();
    });
    setRangeFill(speedSlider);

    connectButton.addEventListener("click", async function () {
      if (bus.connected) {
        pollGeneration++;
        polling = false;
        await stopControllers();
        await bus.disconnect();
        setConnection("", "未连接");
        pollRate.textContent = "-- Hz · -- ms";
        setMessage("串口已断开。");
        calibration.forEach(function (config) { setCardOffline(config.id); });
        return;
      }
      try {
        setConnection("", "正在连接");
        await bus.connect();
        const onlineCount = await initializePositions();
        setConnection("online", "已连接 · " + onlineCount + "/6 在线");
        setMessage("串口连接成功。位置正在以 CLI 同样的连续逐个读取方式更新。", onlineCount === 6 ? "ok" : "error");
        lastTelemetryAt = 0;
        telemetryId = 1;
        if (!polling) startPositionPolling();
      } catch (error) {
        pollGeneration++;
        await bus.disconnect();
        setConnection("error", "连接失败");
        setMessage(error.message, "error");
      }
    });

    refreshButton.addEventListener("click", function () { refreshTelemetry(true); });
    torqueOnButton.addEventListener("click", function () { setAllTorque(true); });
    torqueOffButton.addEventListener("click", function () { setAllTorque(false); });

    if ("serial" in navigator) {
      navigator.serial.addEventListener("disconnect", async function (event) {
        if (event.target === bus.port) {
          pollGeneration++;
          polling = false;
          for (const state of states.values()) {
            state.controlActive = false;
            state.motionEpoch++;
          }
          await bus.disconnect();
          setConnection("error", "设备已断开");
          pollRate.textContent = "-- Hz · -- ms";
          setMessage("串口设备已拔出。", "error");
        }
      });
    }

    async function registerWebMcpTools() {
      const context = document.modelContext;
      if (!context || !context.registerTool) return;
      await context.registerTool({
        name: "read_servo_states",
        title: "读取六轴状态",
        description: "读取 SCS215 ID 1 到 6 的原始位置和按校准映射后的 0 到 1 位置。",
        inputSchema: { type: "object", properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: true, untrustedContentHint: false },
        execute: async function () {
          if (!bus.connected) throw new Error("串口未连接");
          return calibration.map(function (config) {
            const state = states.get(config.id);
            return { id: config.id, name: config.key, online: state.online, rawPosition: state.raw, position: state.actual, target: state.target, torque: state.torque };
          });
        }
      });
      await context.registerTool({
        name: "set_servo_positions",
        title: "设置六轴归一化位置",
        description: "用 0 到 1 的校准坐标设置一个或多个 SCS215 舵机位置。",
        inputSchema: {
          type: "object",
          properties: {
            positions: { type: "object", additionalProperties: { type: "number", minimum: 0, maximum: 1 } },
            speed: { type: "integer", minimum: 1, maximum: 1500 }
          },
          required: ["positions"],
          additionalProperties: false
        },
        annotations: { readOnlyHint: false, untrustedContentHint: false },
        execute: async function (input) {
          if (!bus.connected) throw new Error("串口未连接");
          if (input.speed) {
            speedSlider.value = input.speed;
            speedValue.textContent = String(input.speed);
            setRangeFill(speedSlider);
            bus.speedCache.clear();
          }
          const accepted = [];
          const rejected = [];
          Object.entries(input.positions).forEach(function (entry) {
            const id = Number(entry[0]);
            if (!states.has(id)) return;
            const slider = $("#slider-" + id);
            slider.value = clamp(Number(entry[1]), 0, 1).toFixed(3);
            setRangeFill(slider);
            if (queueTarget(id, Number(slider.value))) accepted.push(id);
            else rejected.push(id);
          });
          return { accepted, rejected };
        }
      });
    }

    registerWebMcpTools().catch(function () {});
  </script>
</body>
</html>
